<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIME ARCHIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #E63946;
      --yellow: #F4D35E;
      --blue:   #4895EF;
      --black:  #0a0a0a;
      --white:  #F1FAEE;
      --g1:     #111111;
      --g2:     #1c1c1c;
      --g3:     #2a2a2a;
    }

    html, body {
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      cursor: none;
    }

    /* ── Custom cursor ── */
    #cursor {
      position: fixed;
      width: 10px; height: 10px;
      background: var(--red);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width .15s, height .15s, background .15s, transform .05s;
      mix-blend-mode: screen;
    }
    #cursor.big { width: 22px; height: 22px; background: var(--yellow); }

    #halo {
      position: fixed;
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(230,57,70,.18) 0%, transparent 68%);
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: left .08s linear, top .08s linear;
    }

    #blob {
      position: fixed;
      width: 240px; height: 240px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9997;
      transform: translate(-50%, -50%);
      transition: left .5s cubic-bezier(.25,.46,.45,.94), top .5s cubic-bezier(.25,.46,.45,.94), background .8s;
      filter: blur(70px);
      opacity: .25;
      background: var(--red);
    }

    /* ── Fixed decorative shapes ── */
    .deco-fixed {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: .04;
    }
    .deco-circle-br {
      width: 500px; height: 500px;
      border-radius: 50%;
      border: 1px solid var(--red);
      bottom: -160px; left: -120px;
    }
    .deco-square-tr {
      width: 180px; height: 180px;
      background: var(--yellow);
      top: 120px; right: -40px;
    }
    .deco-triangle-tl {
      width: 0; height: 0;
      border-left: 80px solid transparent;
      border-right: 80px solid transparent;
      border-bottom: 140px solid var(--blue);
      top: 300px; left: 30px;
      opacity: .025;
    }

    /* ── Header ── */
    header {
      position: relative;
      padding: 44px 48px 32px;
      border-bottom: 1px solid var(--g3);
      overflow: hidden;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      z-index: 2;
    }

    .logo-sub {
      font-size: 10px;
      letter-spacing: .45em;
      text-transform: uppercase;
      color: rgba(241,250,238,.3);
      margin-bottom: 6px;
    }
    .logo-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(72px, 11vw, 172px);
      line-height: .88;
      letter-spacing: -.01em;
      display: flex;
    }
    .c-red    { color: var(--red); }
    .c-yellow { color: var(--yellow); }
    .c-blue   { color: var(--blue); }

    .header-stats {
      display: flex;
      gap: 48px;
      align-items: flex-end;
      padding-bottom: 4px;
    }
    .stat-item { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(56px, 7vw, 110px);
      line-height: 1;
    }
    .stat-label {
      font-size: 9px;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: rgba(241,250,238,.3);
      margin-top: 2px;
    }

    /* tiny decorations in header */
    .h-deco-sq {
      position: absolute; bottom: -16px; right: 280px;
      width: 64px; height: 64px;
      background: var(--yellow); opacity: .08; z-index: 1;
    }
    .h-deco-ci {
      position: absolute; top: 24px; right: 380px;
      width: 32px; height: 32px;
      border-radius: 50%; background: var(--blue); opacity: .1; z-index: 1;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 48px;
      border-bottom: 1px solid var(--g3);
    }
    .search-wrap {
      flex: 1;
      position: relative;
    }
    .search-label {
      position: absolute;
      top: -14px; left: 0;
      font-size: 8px;
      letter-spacing: .45em;
      text-transform: uppercase;
      color: var(--red);
    }
    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--g3);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      letter-spacing: .05em;
      padding: 8px 0;
      outline: none;
      transition: border-color .2s;
    }
    .search-input::placeholder {
      color: rgba(241,250,238,.18);
      font-size: 11px;
      letter-spacing: .3em;
      text-transform: uppercase;
    }
    .search-input:focus { border-bottom-color: var(--red); }

    .btn-add {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: .15em;
      background: var(--red);
      color: var(--white);
      border: none;
      padding: 11px 28px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 4px 4px 0 var(--yellow);
      transition: transform .12s, box-shadow .12s;
    }
    .btn-add:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--yellow); }
    .btn-add:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--yellow); }

    /* ── Grid ── */
    .grid-wrap {
      padding: 3px;
      transition: transform .35s cubic-bezier(.25,.46,.45,.94);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
    }

    /* ── Card ── */
    .card {
      position: relative;
      background: var(--g1);
      border: 1px solid var(--g2);
      padding: 28px 28px 24px;
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      cursor: default;
      min-height: 220px;
      display: flex;
      flex-direction: column;
    }
    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--red), var(--yellow));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
    }
    .card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 4px 4px 0 var(--red);
      border-color: rgba(230,57,70,.4);
      z-index: 10;
    }
    .card:hover::after { transform: scaleX(1); }

    .card-actions {
      position: absolute;
      top: 14px; right: 14px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity .2s;
    }
    .card:hover .card-actions { opacity: 1; }

    .btn-act {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 11px;
      letter-spacing: .1em;
      padding: 4px 10px;
      border: none;
      cursor: pointer;
      transition: transform .1s;
    }
    .btn-act:hover { transform: translate(-1px,-1px); }
    .btn-edit-act { background: var(--yellow); color: var(--black); box-shadow: 2px 2px 0 rgba(244,211,94,.3); }
    .btn-del-act { background: transparent; color: var(--red); border: 1px solid var(--red); box-shadow: 2px 2px 0 rgba(230,57,70,.3); }

    .card-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 10px;
      letter-spacing: .35em;
      color: rgba(241,250,238,.18);
      margin-bottom: 14px;
    }
    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(22px, 2.8vw, 38px);
      line-height: 1;
      letter-spacing: .02em;
      color: var(--white);
      margin-bottom: 14px;
      word-break: break-word;
      flex-shrink: 0;
    }
    .rating-geo {
      display: flex;
      gap: 5px;
      align-items: center;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    .rating-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 10px;
      letter-spacing: .2em;
      color: rgba(241,250,238,.25);
      margin-left: 8px;
    }
    .card-review {
      font-size: 12.5px;
      line-height: 1.75;
      color: rgba(241,250,238,.5);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }
    .card-bg-num {
      position: absolute;
      bottom: 8px; right: 16px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 100px;
      line-height: 1;
      color: var(--white);
      opacity: .028;
      pointer-events: none;
      user-select: none;
    }

    /* ── Geo shapes ── */
    .geo-c {
      display: inline-block;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
    }
    .geo-s {
      display: inline-block;
      background: var(--yellow);
      flex-shrink: 0;
    }
    .geo-t {
      display: inline-block;
      width: 0; height: 0;
      border-style: solid;
      flex-shrink: 0;
    }
    .geo-e {
      display: inline-block;
      border: 1px solid rgba(241,250,238,.12);
      flex-shrink: 0;
    }

    /* ── Empty / no-results ── */
    .state-msg {
      grid-column: span 12;
      padding: 100px 48px;
      text-align: center;
    }
    .state-big {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(40px, 6vw, 80px);
      color: rgba(241,250,238,.07);
      letter-spacing: .3em;
    }
    .state-small {
      font-size: 11px;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: rgba(241,250,238,.18);
      margin-top: 14px;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.82);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--g1);
      border: 1px solid var(--g3);
      width: 92%;
      max-width: 500px;
      padding: 44px 44px 40px;
      position: relative;
      box-shadow: 8px 8px 0 var(--red), 12px 12px 0 rgba(244,211,94,.2);
      animation: slideIn .25s ease;
    }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-label {
      font-size: 9px;
      letter-spacing: .45em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 6px;
    }
    .modal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 44px;
      line-height: 1;
      letter-spacing: .04em;
      margin-bottom: 36px;
    }
    .modal-close {
      position: absolute;
      top: 20px; right: 20px;
      background: transparent;
      border: none;
      color: rgba(241,250,238,.35);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      cursor: pointer;
      transition: color .2s;
      line-height: 1;
    }
    .modal-close:hover { color: var(--white); }

    .form-group { margin-bottom: 28px; }
    .form-label {
      display: block;
      font-size: 8px;
      letter-spacing: .45em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 10px;
    }
    .form-input, .form-textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--g3);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      padding: 8px 0;
      outline: none;
      transition: border-color .2s;
      resize: none;
    }
    .form-input:focus, .form-textarea:focus { border-bottom-color: var(--red); }
    .form-textarea { min-height: 110px; line-height: 1.65; }

    /* Rating picker */
    .rating-pick {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .r-opt { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .r-opt input[type="radio"] { display: none; }
    .r-preview {
      display: flex;
      gap: 3px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--g3);
      transition: border-color .2s, background .2s;
      min-width: 42px;
      justify-content: center;
    }
    .r-opt input:checked ~ .r-preview,
    .r-opt:has(input:checked) .r-preview {
      border-color: var(--red);
      background: rgba(230,57,70,.1);
    }
    .r-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 11px;
      letter-spacing: .1em;
      color: rgba(241,250,238,.35);
    }

    .btn-submit {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: .2em;
      background: var(--red);
      color: var(--white);
      border: none;
      padding: 14px 0;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--yellow);
      width: 100%;
      margin-top: 8px;
      transition: transform .12s, box-shadow .12s;
    }
    .btn-submit:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--yellow); }
    .btn-submit:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--yellow); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--yellow);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: .25em;
      padding: 10px 28px;
      z-index: 9999;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 3px 3px 0 var(--red);
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--black); }
    ::-webkit-scrollbar-thumb { background: var(--g3); }
    ::-webkit-scrollbar-thumb:hover { background: var(--red); }

    @media (max-width: 700px) {
      header { padding: 28px 20px 24px; }
      .controls { padding: 16px 20px; }
      .grid-wrap { padding: 2px; }
      .grid { gap: 2px; }
      .modal { padding: 32px 24px 28px; }
      .header-stats { gap: 24px; }
    }
  </style>
</head>
<body>

  <!-- Mouse FX -->
  <div id="cursor"></div>
  <div id="halo"></div>
  <div id="blob"></div>

  <!-- BG Decorations -->
  <div class="deco-fixed deco-circle-br"></div>
  <div class="deco-fixed deco-square-tr"></div>
  <div class="deco-fixed deco-triangle-tl"></div>

  <!-- Header -->
  <header>
    <div class="h-deco-sq"></div>
    <div class="h-deco-ci"></div>
    <div class="header-top">
      <div>
        <div class="logo-sub">Personal Anime Review Archive</div>
        <div class="logo-title">
          <span class="c-red">AR</span><span class="c-yellow">CHI</span><span class="c-blue">VE</span>
        </div>
      </div>
      <div class="header-stats">
        <div class="stat-item">
          <span class="stat-number c-yellow" id="stat-count">00</span>
          <span class="stat-label">Total Works</span>
        </div>
        <div class="stat-item">
          <span class="stat-number c-red" id="stat-avg">—</span>
          <span class="stat-label">Avg Rating</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Controls -->
  <div class="controls">
    <div class="search-wrap">
      <span class="search-label">Search</span>
      <input id="search-input" class="search-input" type="text" placeholder="Search title or review...">
    </div>
    <button class="btn-add" id="btn-add">＋ New Entry</button>
  </div>

  <!-- Grid -->
  <div class="grid-wrap" id="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-label" id="modal-label">New Entry</div>
      <div class="modal-title" id="modal-heading">Add to Archive</div>
      <form id="entry-form" novalidate>
        <input type="hidden" id="f-id">
        <div class="form-group">
          <label class="form-label" for="f-title">Title</label>
          <input id="f-title" class="form-input" type="text" placeholder="Anime title..." autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">Rating</label>
          <div class="rating-pick" id="rating-pick"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-review">Review</label>
          <textarea id="f-review" class="form-textarea" placeholder="Your thoughts on this work..."></textarea>
        </div>
        <button type="submit" class="btn-submit" id="btn-submit">Save Entry</button>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

<script>
// ── Constants ───────────────────────────────────────────────────────────────
const KEY = 'anime-archive-v1';

// Rating → shape sequence
// C = circle (red), S = square (yellow), T = triangle (blue)
const SHAPES_MAP = {
  1: ['C'],
  2: ['C','S'],
  3: ['C','S','T'],
  4: ['C','C','S','S'],
  5: ['C','C','S','T','T']
};

// Grid col-span sequence (groups sum to 12)
const COL_SEQ = [7,5, 4,4,4, 5,7, 6,6, 8,4, 12, 7,5, 4,8, 6,6];

// Blob colors cycling on mouse click
const BLOB_COLORS = ['#E63946','#F4D35E','#4895EF'];

// ── State ───────────────────────────────────────────────────────────────────
let entries = [];
let editId   = null;
let query    = '';
let blobIdx  = 0;

// ── Persistence ─────────────────────────────────────────────────────────────
function load() {
  try { entries = JSON.parse(localStorage.getItem(KEY) || '[]'); }
  catch { entries = []; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(entries)); }
function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ── Geometry helpers ─────────────────────────────────────────────────────────
function shapeEl(type, sz) {
  const el = document.createElement('span');
  if (type === 'C') {
    el.className = 'geo-c';
    el.style.cssText = `width:${sz}px;height:${sz}px`;
  } else if (type === 'S') {
    el.className = 'geo-s';
    el.style.cssText = `width:${sz}px;height:${sz}px`;
  } else if (type === 'T') {
    el.className = 'geo-t';
    const h = sz, hw = Math.round(sz * .58);
    el.style.cssText = `border-left:${hw}px solid transparent;border-right:${hw}px solid transparent;border-bottom:${h}px solid var(--blue)`;
  } else {
    el.className = 'geo-e';
    el.style.cssText = `width:${sz}px;height:${sz}px`;
  }
  return el;
}

function ratingGeoHTML(rating, sz = 10) {
  const frag = document.createDocumentFragment();
  (SHAPES_MAP[rating] || []).forEach(t => frag.appendChild(shapeEl(t, sz)));
  return frag;
}

function ratingGeoHTMLStr(rating, sz = 9) {
  return (SHAPES_MAP[rating] || []).map(t => {
    if (t === 'C') return `<span class="geo-c" style="width:${sz}px;height:${sz}px"></span>`;
    if (t === 'S') return `<span class="geo-s" style="width:${sz}px;height:${sz}px"></span>`;
    const h = sz, hw = Math.round(sz * .58);
    return `<span class="geo-t" style="border-left:${hw}px solid transparent;border-right:${hw}px solid transparent;border-bottom:${h}px solid var(--blue)"></span>`;
  }).join('');
}

// ── Stats ────────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('stat-count').textContent = String(entries.length).padStart(2,'0');
  if (!entries.length) {
    document.getElementById('stat-avg').textContent = '—';
  } else {
    const avg = entries.reduce((s,e) => s + e.rating, 0) / entries.length;
    document.getElementById('stat-avg').textContent = avg.toFixed(1);
  }
}

// ── Render ───────────────────────────────────────────────────────────────────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getColSpan(idx) {
  return COL_SEQ[idx % COL_SEQ.length];
}

function render() {
  updateStats();
  const grid = document.getElementById('grid');

  const q = query.toLowerCase();
  const filtered = entries.filter(e =>
    !q || e.title.toLowerCase().includes(q) || (e.review||'').toLowerCase().includes(q)
  );

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="state-msg">
        <div class="state-big">${entries.length ? 'NO MATCHES' : 'NO ENTRIES YET'}</div>
        <div class="state-small">${entries.length ? 'Try a different search term' : 'Click "New Entry" to start your archive'}</div>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map((entry, i) => {
    const globalIdx = entries.indexOf(entry);
    const num = String(globalIdx + 1).padStart(2,'0');
    const col = getColSpan(i);
    return `
      <div class="card" data-id="${entry.id}" style="grid-column:span ${col}">
        <div class="card-actions">
          <button class="btn-act btn-edit-act" data-id="${entry.id}">Edit</button>
          <button class="btn-act btn-del-act"  data-id="${entry.id}">Del</button>
        </div>
        <div class="card-num">${num}</div>
        <div class="card-title">${esc(entry.title)}</div>
        <div class="rating-geo">
          ${ratingGeoHTMLStr(entry.rating, 10)}
          <span class="rating-score">${entry.rating} / 5</span>
        </div>
        <div class="card-review">${esc(entry.review || '')}</div>
        <div class="card-bg-num">${entry.rating}</div>
      </div>`;
  }).join('');

  // Events
  grid.querySelectorAll('.btn-edit-act').forEach(b => {
    b.addEventListener('click', e => { e.stopPropagation(); openEdit(b.dataset.id); });
  });
  grid.querySelectorAll('.btn-del-act').forEach(b => {
    b.addEventListener('click', e => { e.stopPropagation(); deleteEntry(b.dataset.id); });
  });

  // Hover → grid shift
  const wrap = document.getElementById('grid-wrap');
  grid.querySelectorAll('.card').forEach(c => {
    c.addEventListener('mouseenter', () => { wrap.style.transform = 'translate(2px,-1.5px)'; });
    c.addEventListener('mouseleave', () => { wrap.style.transform = ''; });
  });
}

// ── CRUD ─────────────────────────────────────────────────────────────────────
function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  save();
  render();
  toast('Entry removed from archive');
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(isEdit) {
  document.getElementById('modal-label').textContent   = isEdit ? 'Editing' : 'New Entry';
  document.getElementById('modal-heading').textContent = isEdit ? 'Update Entry' : 'Add to Archive';
  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  document.getElementById('entry-form').reset();
  document.getElementById('f-id').value = '';
  editId = null;
  setRating(3);
}

function openEdit(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  editId = id;
  document.getElementById('f-id').value    = id;
  document.getElementById('f-title').value  = e.title;
  document.getElementById('f-review').value = e.review || '';
  openModal(true);
  setRating(e.rating);
}

function setRating(n) {
  const inp = document.querySelector(`#rating-pick input[value="${n}"]`);
  if (inp) inp.checked = true;
}

// ── Rating picker builder ────────────────────────────────────────────────────
function buildRatingPicker() {
  const container = document.getElementById('rating-pick');
  container.innerHTML = [1,2,3,4,5].map(n => `
    <label class="r-opt">
      <input type="radio" name="rating" value="${n}" ${n===3?'checked':''}>
      <div class="r-preview">${ratingGeoHTMLStr(n, 8)}</div>
      <span class="r-val">${n}</span>
    </label>`).join('');
}

// ── Form submit ───────────────────────────────────────────────────────────────
document.getElementById('entry-form').addEventListener('submit', ev => {
  ev.preventDefault();
  const title  = document.getElementById('f-title').value.trim();
  const review = document.getElementById('f-review').value.trim();
  const rInp   = document.querySelector('#rating-pick input[name="rating"]:checked');
  const rating = rInp ? parseInt(rInp.value) : 3;

  if (!title) {
    document.getElementById('f-title').focus();
    return;
  }

  if (editId) {
    const idx = entries.findIndex(e => e.id === editId);
    if (idx !== -1) entries[idx] = { ...entries[idx], title, review, rating };
    toast('Entry updated');
  } else {
    entries.unshift({ id: uid(), title, review, rating, date: new Date().toISOString() });
    toast('Entry added to archive');
  }
  save();
  render();
  closeModal();
});

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ── Mouse FX ──────────────────────────────────────────────────────────────────
const cursor = document.getElementById('cursor');
const halo   = document.getElementById('halo');
const blob   = document.getElementById('blob');

document.addEventListener('mousemove', ev => {
  cursor.style.left = ev.clientX + 'px';
  cursor.style.top  = ev.clientY + 'px';
  halo.style.left   = ev.clientX + 'px';
  halo.style.top    = ev.clientY + 'px';
  blob.style.left   = ev.clientX + 'px';
  blob.style.top    = ev.clientY + 'px';
});

document.addEventListener('click', () => {
  blobIdx = (blobIdx + 1) % BLOB_COLORS.length;
  blob.style.background = BLOB_COLORS[blobIdx];
});

document.addEventListener('mouseover', ev => {
  const big = ev.target.matches('button,input,textarea,label,a,.card,.r-opt');
  cursor.classList.toggle('big', big);
});

// ── Event listeners ───────────────────────────────────────────────────────────
document.getElementById('btn-add').addEventListener('click', () => {
  editId = null;
  document.getElementById('entry-form').reset();
  document.getElementById('f-id').value = '';
  setRating(3);
  openModal(false);
});

document.getElementById('modal-close').addEventListener('click', closeModal);

document.getElementById('modal-overlay').addEventListener('click', ev => {
  if (ev.target === document.getElementById('modal-overlay')) closeModal();
});

document.getElementById('search-input').addEventListener('input', ev => {
  query = ev.target.value;
  render();
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeModal();
});

// ── Init ──────────────────────────────────────────────────────────────────────
load();
buildRatingPicker();
render();
</script>
</body>
</html>
